<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course QA Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c;
    --panel: #1b1f26;
    --panel-2: #20242c;
    --border: #2b3038;
    --text: #ece9e2;
    --text-dim: #9aa1ac;
    --text-faint: #666d78;
    --accent: #e8a33d;
    --accent-soft: rgba(232, 163, 61, 0.14);

    --critical: #e15554;
    --critical-soft: rgba(225, 85, 84, 0.14);
    --high: #e8a33d;
    --high-soft: rgba(232, 163, 61, 0.14);
    --medium: #4c8bf5;
    --medium-soft: rgba(76, 139, 245, 0.14);
    --low: #8a92a0;
    --low-soft: rgba(138, 146, 160, 0.14);
    --gap: #4fbf9f;
    --gap-soft: rgba(79, 191, 159, 0.14);

    --radius: 6px;
    --font-body: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  :root:not([data-theme="light"]) { color-scheme: dark; }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --panel-2: #f0ede5;
      --border: #ddd7c9;
      --text: #1b1f26;
      --text-dim: #5b6570;
      --text-faint: #8b93a0;
      --accent: #b56f16;
      --accent-soft: rgba(181, 111, 22, 0.10);
      --critical: #c73e3d;
      --critical-soft: rgba(199, 62, 61, 0.10);
      --high: #b56f16;
      --high-soft: rgba(181, 111, 22, 0.10);
      --medium: #2f68c9;
      --medium-soft: rgba(47, 104, 201, 0.10);
      --low: #6b7280;
      --low-soft: rgba(107, 114, 128, 0.10);
      --gap: #2f9678;
      --gap-soft: rgba(47, 150, 120, 0.10);
      color-scheme: light;
    }
  }

  :root[data-theme="light"] {
    --bg: #f6f4ef;
    --panel: #ffffff;
    --panel-2: #f0ede5;
    --border: #ddd7c9;
    --text: #1b1f26;
    --text-dim: #5b6570;
    --text-faint: #8b93a0;
    --accent: #b56f16;
    --accent-soft: rgba(181, 111, 22, 0.10);
    --critical: #c73e3d;
    --critical-soft: rgba(199, 62, 61, 0.10);
    --high: #b56f16;
    --high-soft: rgba(181, 111, 22, 0.10);
    --medium: #2f68c9;
    --medium-soft: rgba(47, 104, 201, 0.10);
    --low: #6b7280;
    --low-soft: rgba(107, 114, 128, 0.10);
    --gap: #2f9678;
    --gap-soft: rgba(47, 150, 120, 0.10);
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding: 32px 20px 80px;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 999px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 15px;
    z-index: 20;
  }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- app header ---------- */

  .app-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .app-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-faint);
    font-family: var(--font-mono);
  }

  /* ---------- course switcher ---------- */

  .course-switcher {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 18px;
  }

  .course-tab {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius);
    padding: 10px 14px;
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 13.5px;
    text-align: left;
    max-width: 260px;
    transition: border-color 0.15s ease;
  }

  .course-tab .tab-name {
    display: block;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .course-tab .tab-meta {
    display: block;
    font-size: 11.5px;
    color: var(--text-faint);
    font-family: var(--font-mono);
  }

  .course-tab.active {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .course-tab.active .tab-name { color: var(--accent); }

  .course-tab.placeholder {
    opacity: 0.55;
    cursor: default;
  }

  .course-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- header / hero ---------- */

  header.hero {
    margin-bottom: 28px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--accent);
    margin: 0 0 10px;
  }

  h1 {
    font-size: 27px;
    line-height: 1.25;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 15px;
    margin: 0 0 20px;
    max-width: 64ch;
  }

  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }

  .stat-chip {
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
  }

  /* ---------- timeline ---------- */

  .timeline-block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 20px 16px;
    margin: 22px 0;
  }

  .timeline-label-row {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-faint);
    margin-bottom: 8px;
  }

  .timeline {
    position: relative;
    height: 34px;
    background: var(--panel-2);
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .timeline-marker {
    position: absolute;
    top: 4px;
    width: 6px;
    height: 26px;
    border-radius: 3px;
    transform: translateX(-3px);
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .timeline-marker:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .timeline-marker.dimmed { opacity: 0.22; }

  .timeline-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 14px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 2px;
    font-family: var(--font-body);
  }
  .legend-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .legend-item.off { opacity: 0.4; }

  .swatch {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ---------- controls ---------- */

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 20px;
  }

  .search-input {
    flex: 1 1 220px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 9px 12px;
    font-family: var(--font-body);
    font-size: 14px;
  }
  .search-input::placeholder { color: var(--text-faint); }
  .search-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  select.sort-select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 9px 10px;
    font-family: var(--font-body);
    font-size: 14px;
  }

  .count-line {
    font-size: 13px;
    color: var(--text-faint);
    margin-bottom: 14px;
  }

  /* ---------- cards ---------- */

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid var(--sev-color, var(--border));
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
    transition: opacity 0.15s ease, border-left-width 0.4s ease;
  }

  .card.resolved {
    opacity: 0.5;
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .card-tags {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .tc-chip {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
  }

  .sev-pill {
    font-size: 11.5px;
    font-weight: 600;
    border-radius: 999px;
    padding: 2px 10px;
    color: var(--sev-color);
    background: var(--sev-soft);
    white-space: nowrap;
  }

  .card h3 {
    font-size: 16.5px;
    font-weight: 600;
    margin: 0 0 8px;
    line-height: 1.35;
  }

  .card p {
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--text);
    margin: 0 0 10px;
  }

  .card .field-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
    margin: 0 0 3px;
  }

  .field-block {
    margin-bottom: 10px;
  }
  .field-block:last-of-type { margin-bottom: 12px; }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 4px;
  }

  .resolve-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }

  .resolve-label input {
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .category-tag {
    font-size: 11.5px;
    color: var(--text-faint);
    font-family: var(--font-mono);
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-dim);
    font-size: 14.5px;
  }
  .empty-state button {
    margin-top: 12px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 7px 14px;
    font-size: 13.5px;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .no-course-state {
    text-align: center;
    padding: 70px 20px;
    color: var(--text-dim);
    font-size: 14.5px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  footer.note {
    margin-top: 30px;
    font-size: 12.5px;
    color: var(--text-faint);
    max-width: 64ch;
    line-height: 1.6;
  }

  @media (max-width: 520px) {
    h1 { font-size: 22px; }
    .card { padding: 15px 16px; }
    .course-tab { max-width: 100%; flex: 1 1 100%; }
  }

  /* ---------- new-analysis form ---------- */

  .course-tab.new-tab {
    border-style: dashed;
    color: var(--accent);
  }
  .course-tab.new-tab .tab-name { color: var(--accent); }

  .analysis-form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .form-note {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 20px;
  }
  .form-note strong { color: var(--accent); }

  .form-row {
    margin-bottom: 16px;
  }

  .form-row label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  .form-row .hint {
    font-size: 11.5px;
    color: var(--text-faint);
    font-weight: 400;
    display: block;
    margin-top: 4px;
  }

  .form-row input[type="text"],
  .form-row input[type="password"],
  .form-row textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 9px 12px;
    font-family: var(--font-body);
    font-size: 14px;
  }

  .form-row textarea {
    min-height: 220px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.5;
    resize: vertical;
  }

  .form-row input:focus-visible,
  .form-row textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (max-width: 560px) {
    .two-col { grid-template-columns: 1fr; }
  }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .checkbox-row input { accent-color: var(--accent); }

  .file-btn-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .file-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius);
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-body);
  }

  .run-btn {
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: var(--radius);
    padding: 11px 20px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-body);
  }
  .run-btn:disabled {
    opacity: 0.55;
    cursor: default;
  }

  .form-error {
    background: var(--critical-soft);
    border: 1px solid var(--critical);
    color: var(--text);
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 13px;
    margin-top: 16px;
    line-height: 1.55;
  }

  .form-status {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 14px;
  }

  .remove-course-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-faint);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: var(--font-body);
    margin-top: 6px;
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark theme">🌓</button>

<div class="wrap">

  <div class="app-title-row">
    <span class="app-title">COURSE QA REVIEW</span>
  </div>

  <div class="course-switcher" id="courseSwitcher"></div>

  <div id="courseContent"></div>

</div>

<script>
(function () {
  "use strict";

  var SEVERITIES = {
    critical: { label: "Critical", color: "var(--critical)", soft: "var(--critical-soft)" },
    high:     { label: "High",     color: "var(--high)",     soft: "var(--high-soft)" },
    medium:   { label: "Medium",   color: "var(--medium)",   soft: "var(--medium-soft)" },
    low:      { label: "Low",      color: "var(--low)",      soft: "var(--low-soft)" },
    gap:      { label: "Missing content", color: "var(--gap)", soft: "var(--gap-soft)" }
  };

  var SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3, gap: 4 };

  // ---------------------------------------------------------------
  // COURSE DATA
  // Add a new entry to this array for each audited video/course.
  // Set findings: [] and status: "pending" for a course that's been
  // added to the tracker but not yet audited.
  // ---------------------------------------------------------------
  var COURSES = [
    {
      id: "word2vec",
      org: "IBM Skills Network",
      name: "Word2Vec Introduction and CBOW Models",
      runtimeLabel: "5:55 runtime",
      runtimeSeconds: 355,
      status: "reviewed",
      findings: [
        {
          id: "f1",
          seconds: 38,
          timecode: "0:38",
          severity: "critical",
          category: "Example used",
          title: "The \u201cking \u2212 man = queen\u201d example is wrong",
          description: "The video says that if you take the vector for \u201cking\u201d and subtract \u201cman,\u201d you get something close to \u201cqueen.\u201d That's not actually true. The real trick needs one more step: king \u2212 man + woman \u2248 queen. Leaving out \u201c+ woman\u201d isn't a small simplification \u2014 it changes what the example is showing, and it's one of the most well-known facts about word vectors, so it's easy for someone to double check and notice it's off.",
          why: "This is the single most memorable example in the video. If a learner repeats it, uses it in an interview, or tries to reproduce it and gets a different result, they'll be confused \u2014 and rightly so, because the claim as stated doesn't hold up.",
          fix: "Update the line to include the missing step: \u201csubtracting the vector for \u2018man\u2019 from \u2018king,\u2019 then adding \u2018woman,\u2019 yields a vector close to \u2018queen.\u2019\u201d"
        },
        {
          id: "f2",
          seconds: 259,
          timecode: "4:19",
          severity: "high",
          category: "Code shown",
          title: "The code quietly adds an extra step that isn't standard",
          description: "The code includes an extra math step (called ReLU) between two parts of the network. The original, textbook version of this model is specifically designed to skip that kind of step \u2014 that's actually one of the reasons the original method was fast enough to be useful. The video never mentions that this version adds something the standard approach doesn't have.",
          why: "A learner who later reads about this model elsewhere, or in the original research, will find a mismatch and may think either the video or the other source is wrong \u2014 when really, this version is just a variation that was never flagged as one.",
          fix: "Either remove that extra step to match the standard approach, or add a line noting: \u201cthis version includes an extra step beyond the original design.\u201d"
        },
        {
          id: "f3",
          seconds: 243,
          timecode: "4:03",
          severity: "medium",
          category: "Code shown",
          title: "A variable is created in the code but never used",
          description: "The code sets up a value called num_class when building the model, but that value is never actually used anywhere afterward \u2014 the code uses a different, already-existing value instead. It just sits there, unused.",
          why: "Anyone copying this code into their own project inherits confusing, dead code and may waste time trying to figure out what num_class is supposed to do.",
          fix: "Either delete the unused value, or actually use it where the output size is being set."
        },
        {
          id: "f4",
          seconds: 288,
          timecode: "4:48",
          severity: "medium",
          category: "Consistency",
          title: "The worked example and the actual code don't use the same settings",
          description: "Earlier, the video walks through an example using 1 word of context on each side of the target word. But when the code actually runs, it's set to use 2 words of context on each side instead. Nobody mentions or explains the change.",
          why: "A learner trying to match the hand-worked example to the code's output will get confused when the numbers don't line up, and may think they misunderstood something \u2014 when the material is just inconsistent.",
          fix: "Either change the code to match the example (1 word each side), or add a line explaining why it's being widened to 2."
        },
        {
          id: "f5",
          seconds: 135,
          timecode: "2:15",
          severity: "medium",
          category: "Terminology",
          title: "The same part of the model is given two different names",
          description: "The on-screen diagrams label the middle part of the network \u201chidden layer.\u201d The narrator calls that same part the \u201cembedding layer\u201d throughout. They're the same thing \u2014 but nothing on screen ever says so.",
          why: "A learner comparing notes or a quiz question might think these are two separate parts of the network, rather than one part with two names.",
          fix: "Pick one name and use it consistently in both the diagrams and the narration, or add a one-time note that the two terms mean the same thing here."
        },
        {
          id: "f6",
          seconds: 277,
          timecode: "4:37",
          severity: "medium",
          category: "Consistency",
          title: "\u201cOne-hot vectors\u201d is said, but the code does something else",
          description: "The narrator says words are \u201cencoded as one-hot vectors\u201d before going into the model. But the actual code shown minutes later skips that step entirely and uses a shortcut (a simple ID number per word) instead \u2014 which is the whole point of the PyTorch tool being used.",
          why: "A learner who looks closely at the code after hearing \u201cone-hot vectors\u201d may think the code doesn't match what they were just taught, when really both are valid \u2014 they're just different levels of description that were never connected.",
          fix: "Add a line bridging the two: \u201cconceptually, this is a one-hot vector; in practice, the code uses a shortcut \u2014 a word ID number \u2014 to get the same result more efficiently.\u201d"
        },
        {
          id: "f7",
          seconds: 260,
          timecode: "4:20",
          severity: "low",

  function buildTimeline(course) {
    var track = document.getElementById("timeline");
    if (!track) return;
    track.innerHTML = "";
    course.findings.forEach(function (f) {
      if (f.seconds === null) return;
      var pct = (f.seconds / course.runtimeSeconds) * 100;
      var btn = document.createElement("button");
      btn.className = "timeline-marker";
      btn.style.left = pct + "%";
      btn.style.background = SEVERITIES[f.severity].color;
      btn.title = f.timecode + " — " + f.title;
      btn.setAttribute("aria-label", "Jump to finding at " + f.timecode + ": " + f.title);
      btn.addEventListener("click", function () {
        var target = document.getElementById("card-" + f.id);
        if (target) {
          target.scrollIntoView({ behavior: "smooth", block: "center" });
          target.style.borderLeftWidth = "6px";
          setTimeout(function () { target.style.borderLeftWidth = "3px"; }, 350);
        }
      });
      track.appendChild(btn);
    });
    refreshTimelineDimming(course);
  }

  function refreshTimelineDimming(course) {
    var track = document.getElementById("timeline");
    if (!track) return;
    var markers = track.querySelectorAll(".timeline-marker");
    var idx = 0;
    course.findings.forEach(function (f) {
      if (f.seconds === null) return;
      var m = markers[idx];
      if (m) m.classList.toggle("dimmed", !activeFilters[f.severity]);
      idx++;

      var item = document.createElement("button");
      item.className = "legend-item";

      item.innerHTML = '<span class="swatch" style="background:' + SEVERITIES[key].color + '"></span>' +

  function matchesSearch(f, term) {
    if (!term) return true;
    var haystack = (f.title + " " + f.description + " " + f.category).toLowerCase();
    return haystack.indexOf(term.toLowerCase()) !== -1;
  }

  function renderList(course) {
    var list = course.findings.filter(function (f) {
      return activeFilters[f.severity] && matchesSearch(f, searchTerm);
    });

    if (sortMode === "time") {
      list.sort(function (a, b) {
        var as = a.seconds === null ? Infinity : a.seconds;
        var bs = b.seconds === null ? Infinity : b.seconds;
        return as - bs;
      });
    } else {
      list.sort(function (a, b) { return SEV_ORDER[a.severity] - SEV_ORDER[b.severity]; });
    }

    var container = document.getElementById("cardList");
    var empty = document.getElementById("emptyState");
    if (!container) return;

    if (list.length === 0) {
      container.innerHTML = "";
      if (empty) empty.style.display = "block";

      if (empty) empty.style.display = "none";
      container.innerHTML = list.map(cardHtml).join("");

    var countLine = document.getElementById("countLine");
    if (countLine) countLine.textContent = "Showing " + list.length + " of " + course.findings.length + " findings";

  function slugify(str) {
    var base = str.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    return (base || "course") + "-" + Date.now().toString(36);
  }

  // Looks for SRT-style timestamps (00:05:38,827 --> 00:05:42,043) and
  // returns the latest end time found, in seconds — or null if none found.
  function detectRuntimeSeconds(text) {
    var re = /(\d{2}):(\d{2}):(\d{2}),\d{3}\s*-->\s*(\d{2}):(\d{2}):(\d{2}),\d{3}/g;
    var match;
    var maxSeconds = null;
    while ((match = re.exec(text)) !== null) {
      var h = parseInt(match[4], 10), m = parseInt(match[5], 10), s = parseInt(match[6], 10);
      var total = h * 3600 + m * 60 + s;
      if (maxSeconds === null || total > maxSeconds) maxSeconds = total;
    }
    return maxSeconds;
  }

  function formatRuntimeLabel(seconds) {
    if (seconds === null) return "Text-based analysis";
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return m + ":" + (s < 10 ? "0" : "") + s + " runtime";
  }

  var ANALYSIS_SYSTEM_PROMPT = [
    "You are auditing an e-learning video transcript for an advanced learner audience.",
    "Find genuine issues only \u2014 do not invent problems that aren't there, and do not pad the list to hit a target count.",
    "Look for: technical inaccuracies, outdated information, terminology inconsistencies, missing important concepts, logically inconsistent statements, misleading examples, and grammar/spelling errors that could confuse a learner.",
    "",
    "Return ONLY a JSON array (no prose, no markdown code fences, no explanation before or after it). Each element must be an object with exactly these fields:",
    '  "seconds": number or null \u2014 the timestamp in seconds where this issue occurs, if the transcript includes timing information near it. Use null if there is no clear timestamp, or if this is a general/missing-content issue with no single moment.',
    '  "timecode": string or null \u2014 a short display label matching "seconds", formatted like "4:19". Use null when "seconds" is null.',
    '  "severity": one of "critical", "high", "medium", "low", "gap" \u2014 use "gap" specifically for important missing content rather than a stated error.',
    '  "category": a short 2-4 word tag, e.g. "Terminology", "Code shown", "Missing content".',
    '  "title": a short, plain-language issue title \u2014 no jargon, something a non-expert could understand at a glance.',
    '  "description": 2-4 plain-language sentences explaining the issue \u2014 avoid technical jargon where possible, or briefly explain any term you must use.',
    '  "why": one or two sentences on why this matters for a learner.',
    '  "fix": one or two sentences on what to change.',
    "",
    "If the transcript has no real issues in some area, do not force a finding there. It's fine to return an empty array if you genuinely find nothing worth flagging."
  ].join("\n");

  function callClaudeForAnalysis(transcriptText, apiKey) {
    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4000,
        system: ANALYSIS_SYSTEM_PROMPT,
        messages: [
          { role: "user", content: "Here is the transcript to audit:\n\n" + transcriptText }
        ]
      })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          throw new Error("API returned " + res.status + ": " + t.slice(0, 300));
        });
      }
      return res.json();
    }).then(function (data) {
      var textBlock = (data.content || []).filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n");
      var cleaned = textBlock.replace(/```json/gi, "").replace(/```/g, "").trim();
      var parsed;
      try {
        parsed = JSON.parse(cleaned);
      } catch (e) {
        throw new Error("Could not parse the model's response as JSON. Raw response started with: " + cleaned.slice(0, 200));
      }
      if (!Array.isArray(parsed)) throw new Error("Expected a JSON array of findings but got something else.");
      return parsed;
    });
  }

      '</div>';

    document.getElementById("fileBtn").addEventListener("click", function () {
      document.getElementById("fileInput").click();
    });

    document.getElementById("fileInput").addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (evt) {
        document.getElementById("transcriptInput").value = evt.target.result;
        if (!document.getElementById("newCourseTitle").value) {
          document.getElementById("newCourseTitle").value = file.name.replace(/\.(txt|srt)$/i, "").replace(/[_-]+/g, " ");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("runAnalysisBtn").addEventListener("click", function () {
      var titleEl = document.getElementById("newCourseTitle");
      var orgEl = document.getElementById("newCourseOrg");
      var keyEl = document.getElementById("apiKeyInput");
      var textEl = document.getElementById("transcriptInput");
      var rememberEl = document.getElementById("rememberKey");
      var statusEl = document.getElementById("formStatus");
      var btn = document.getElementById("runAnalysisBtn");

      var title = titleEl.value.trim();
      var org = orgEl.value.trim() || "Self-service analysis";
      var apiKey = keyEl.value.trim();
      var transcript = textEl.value.trim();

      statusEl.innerHTML = "";

      if (!title) { statusEl.innerHTML = '<div class="form-error">Add a title so this shows up clearly in the course list.</div>'; return; }
      if (!apiKey) { statusEl.innerHTML = '<div class="form-error">An API key is required to run this.</div>'; return; }
      if (!transcript) { statusEl.innerHTML = '<div class="form-error">Paste a transcript or load a file first.</div>'; return; }

      try {
        if (rememberEl.checked) {
          localStorage.setItem("course-qa-api-key", apiKey);
          sessionStorage.setItem("course-qa-api-key", apiKey);
        } else {
          sessionStorage.setItem("course-qa-api-key", apiKey);
        }
      } catch (e) { /* ignore */ }

      btn.disabled = true;
      btn.textContent = "Analyzing\u2026";
      statusEl.innerHTML = '<p class="form-status">Sending transcript to Claude \u2014 this can take a moment for longer transcripts.</p>';

      var runtimeSeconds = detectRuntimeSeconds(transcript);

      callClaudeForAnalysis(transcript, apiKey).then(function (rawFindings) {
        var findings = rawFindings.map(function (f, i) {
          return {
            id: "f" + (i + 1),
            seconds: (typeof f.seconds === "number") ? f.seconds : null,
            timecode: f.timecode || null,
            severity: ["critical", "high", "medium", "low", "gap"].indexOf(f.severity) !== -1 ? f.severity : "medium",
            category: f.category || "General",
            title: f.title || "Untitled finding",
            description: f.description || "",
            why: f.why || "",
            fix: f.fix || ""
          };
        });

        var newCourse = {
          id: slugify(title),
          org: org,
          name: title,
          runtimeLabel: formatRuntimeLabel(runtimeSeconds),
          runtimeSeconds: runtimeSeconds,
          status: "reviewed",
          findings: findings,
          custom: true
        };

        COURSES.push(newCourse);
        var customList = loadCustomCourses();
        customList.push(newCourse);
        saveCustomCourses(customList);

        activeCourseId = newCourse.id;
        renderAll();
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = "Run analysis";
        statusEl.innerHTML = '<div class="form-error">Something went wrong: ' + escapeHtml(err.message) +
          '<br><br>Common causes: an invalid or restricted API key, no network access to api.anthropic.com, or a very long transcript. Double check the key at console.anthropic.com and try again.</div>';
      });
    });
  }

  function renderAll() {
    buildSwitcher();
    renderCourseContent();
  }

  var themeToggle = document.getElementById("themeToggle");
  function applyStoredTheme() {
    try {
      var stored = localStorage.getItem("course-qa-theme");
      if (stored) document.documentElement.setAttribute("data-theme", stored);
    } catch (e) { /* ignore */ }
  }
  applyStoredTheme();
  themeToggle.addEventListener("click", function () {
    var current = document.documentElement.getAttribute("data-theme");
    var isDark = current ? current === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("course-qa-theme", next); } catch (e) { /* ignore */ }
  });

  renderAll();
})();
</script>
</body>
</html>
